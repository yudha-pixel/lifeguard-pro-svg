<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0A0A0A; font-family: 'DM Sans', sans-serif; padding: 20px; width: 700px; }
  .label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #E25B45; margin-bottom: 14px; }
  .cols { display: flex; gap: 16px; }
  .col { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field-label { font-size: 10px; font-weight: 600; color: #1a2744; letter-spacing: 0.06em; text-transform: uppercase; }
  .field-value { font-size: 13px; color: #B0B8C4; }
  .field-value.danger { color: #cc2229; font-weight: 600; }
  .field-value.success { color: #188038; }
  .input {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 4px;
    padding: 6px 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    color: #B0B8C4;
    width: 100%;
  }
  .input::placeholder { color: #444; }
  .select {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 12px;
    color: #B0B8C4;
    width: 100%;
  }
  .kv { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; border-bottom: 1px solid #1e1e1e; }
  .kv-label { font-size: 11px; color: #5f6368; }
  .kv-val { font-size: 12px; color: #B0B8C4; font-weight: 500; }
  .hint { font-size: 10px; color: #5f6368; margin-top: 1px; }
</style>
</head>
<body>
  <div class="label">Fields & Inputs</div>
  <div class="cols">
    <div class="col">
      <div class="col-header" style="font-size:10px;color:#555;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:2px">Read-Only Fields</div>
      <div class="field">
        <div class="field-label">FROM</div>
        <div class="field-value">Franklin Rodriguez</div>
      </div>
      <div class="field">
        <div class="field-label">EMAIL</div>
        <div class="field-value">f.rodriguez@corp.com</div>
      </div>
      <div class="field">
        <div class="field-label">CONTACT RULES</div>
        <div class="field-value danger">DO NOT CONTACT</div>
      </div>
      <div class="field">
        <div class="field-label">STATUS</div>
        <div class="field-value success">Yes</div>
      </div>
      <div style="margin-top:6px">
        <div class="kv"><span class="kv-label">Last Route</span><span class="kv-val">/gmail_crm/bootstrap</span></div>
        <div class="kv"><span class="kv-label">Last Duration</span><span class="kv-val">342 ms</span></div>
        <div class="kv"><span class="kv-label">Last Success</span><span class="kv-val">9:42 AM</span></div>
      </div>
    </div>
    <div class="col">
      <div class="col-header" style="font-size:10px;color:#555;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:2px">Editable Fields</div>
      <div class="field">
        <div class="field-label">Contact Name (Edit)</div>
        <input class="input" placeholder="e.g. Sarah Mitchell" value="Sarah Mitchell">
      </div>
      <div class="field">
        <div class="field-label">Stage (Edit)</div>
        <select class="select">
          <option>Qualified Lead</option>
          <option>Proposal</option>
          <option>Negotiation</option>
          <option>Won</option>
        </select>
      </div>
      <div class="field">
        <div class="field-label">Expected Revenue (Edit)</div>
        <input class="input" value="12000" placeholder="e.g. 5000">
      </div>
      <div class="field">
        <div class="field-label">Notes (Edit)</div>
        <textarea class="input" rows="3" placeholder="Enter notes...">Follow up re: proposal sent on 5/17. Key decision maker is Sarah.</textarea>
      </div>
    </div>
  </div>
</body>
</html>
