<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0A0A0A; font-family: 'DM Sans', sans-serif; padding: 20px; width: 700px; }
  .label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #E25B45; margin-bottom: 14px; }
  .rows { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row-label { width: 130px; font-size: 10px; color: #444; flex-shrink: 0; }
  .btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    border-radius: 6px;
    padding: 7px 16px;
    cursor: pointer;
    border: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .btn-primary { background: #1a2744; color: #fff; }
  .btn-accent  { background: #E25B45; color: #fff; }
  .btn-danger  { background: #cc2229; color: #fff; }
  .btn-success { background: #188038; color: #fff; }
  .btn-ghost   { background: transparent; color: #B0B8C4; border: 1px solid #333; }
  .btn-sm { padding: 4px 10px; font-size: 11px; border-radius: 4px; }
  .btn-icon { padding: 6px 10px; font-size: 13px; }
  .tab-active { background: #1a2744; color: #fff; border-radius: 4px; padding: 4px 10px; font-size: 11px; font-weight: 500; }
  .tab-inactive { background: transparent; color: #5f6368; padding: 4px 10px; font-size: 11px; cursor: pointer; }
</style>
</head>
<body>
  <div class="label">Buttons & Controls</div>
  <div class="rows">
    <div class="row">
      <div class="row-label">Primary (FILLED)</div>
      <button class="btn btn-primary">Save Quick Deal Info</button>
      <button class="btn btn-primary">Load CRM Data</button>
      <button class="btn btn-primary">Create Opportunity</button>
    </div>
    <div class="row">
      <div class="row-label">Accent (Terracotta)</div>
      <button class="btn btn-accent">▸ Quick Add Activity</button>
      <button class="btn btn-accent">Post Log Note</button>
    </div>
    <div class="row">
      <div class="row-label">Danger / Error</div>
      <button class="btn btn-danger">Connection Error</button>
      <button class="btn btn-ghost btn-sm">Cancel</button>
    </div>
    <div class="row">
      <div class="row-label">Success State</div>
      <button class="btn btn-success">Contact Created</button>
      <button class="btn btn-ghost">↻ Refresh</button>
      <button class="btn btn-ghost btn-sm">‹ Prev</button>
      <button class="btn btn-ghost btn-sm">Next ›</button>
    </div>
    <div class="row">
      <div class="row-label">Tab Navigation</div>
      <span class="tab-active">Preview</span>
      <span class="tab-inactive">Full Deal</span>
      <span class="tab-inactive">Organization</span>
      <span class="tab-inactive">All Contacts</span>
      <span class="tab-inactive">Chatter Box</span>
    </div>
  </div>
</body>
</html>
