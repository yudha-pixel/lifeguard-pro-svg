<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0A0A0A; font-family: 'DM Sans', sans-serif; padding: 20px; width: 700px; }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .swatch {
    flex: 1;
    height: 80px;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 10px 12px;
    border: 1px solid #2a2a2a;
    position: relative;
  }
  .token { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #E25B45; }
  .hex { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.35); }
  .role { font-size: 10px; color: rgba(255,255,255,0.45); }
  .label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #E25B45; margin-bottom: 10px; }
</style>
</head>
<body>
  <div class="label">Surface Scale</div>
  <div class="row">
    <div class="swatch" style="background:#0A0A0A">
      <div class="token">--surface-0</div>
      <div>
        <div class="hex">#0A0A0A</div>
        <div class="role">Canvas / page</div>
      </div>
    </div>
    <div class="swatch" style="background:#161616">
      <div class="token">--surface-1</div>
      <div>
        <div class="hex">#161616</div>
        <div class="role">Cards / panels</div>
      </div>
    </div>
    <div class="swatch" style="background:#1e1e1e">
      <div class="token">--surface-2</div>
      <div>
        <div class="hex">#1e1e1e</div>
        <div class="role">Raised / hover</div>
      </div>
    </div>
    <div class="swatch" style="background:#252525">
      <div class="token">--surface-3</div>
      <div>
        <div class="hex">#252525</div>
        <div class="role">Inputs</div>
      </div>
    </div>
    <div class="swatch" style="background:#2a2a2a">
      <div class="token">--border-subtle</div>
      <div>
        <div class="hex">#2a2a2a</div>
        <div class="role">Dividers</div>
      </div>
    </div>
    <div class="swatch" style="background:#333333">
      <div class="token">--border-default</div>
      <div>
        <div class="hex">#333333</div>
        <div class="role">Card borders</div>
      </div>
    </div>
  </div>
</body>
</html>
