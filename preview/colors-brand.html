<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0A0A0A; font-family: 'DM Sans', sans-serif; padding: 20px; width: 700px; }
  .row { display: flex; gap: 12px; }
  .swatch {
    flex: 1;
    height: 90px;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 10px 12px;
    position: relative;
    overflow: hidden;
  }
  .swatch-name { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; color: #fff; }
  .swatch-hex { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 2px; }
  .swatch-desc { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 3px; }
  .obsidian { background: #0A0A0A; border: 1px solid #2a2a2a; }
  .terracotta { background: #E25B45; }
  .mint { background: #DAFFDE; }
  .mint .swatch-name { color: #0A0A0A; }
  .mint .swatch-hex { color: rgba(0,0,0,0.45); }
  .mint .swatch-desc { color: rgba(0,0,0,0.35); }
  .label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #555; margin-bottom: 8px; }
</style>
</head>
<body>
  <div style="margin-bottom:12px">
    <img src="../assets/Lifeguard-Pro-banner-2.png" style="width:100%;height:52px;object-fit:cover;border-radius:6px;display:block" alt="Lifeguard Pro brand banner">
  </div>
  <div class="label" style="color:#CC2229; margin-bottom:10px">Brand Colors — from logo</div>
  <div class="row">
    <div class="swatch" style="background:#1a2744">
      <div class="swatch-name">Brand Navy</div>
      <div class="swatch-hex">#1a2744</div>
      <div class="swatch-desc">Primary background</div>
    </div>
    <div class="swatch" style="background:#CC2229">
      <div class="swatch-name">Brand Red</div>
      <div class="swatch-hex">#CC2229</div>
      <div class="swatch-desc">Cross / accent / alerts</div>
    </div>
    <div class="swatch" style="background:#FFFFFF">
      <div class="swatch-name" style="color:#1a2744">White</div>
      <div class="swatch-hex" style="color:rgba(0,0,0,0.35)">#FFFFFF</div>
      <div class="swatch-desc" style="color:rgba(0,0,0,0.3)">Wordmark / type</div>
    </div>
  </div>
</body>
</html>
